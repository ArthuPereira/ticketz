name: ticketz

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketz-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: ticketz-valkey
    restart: unless-stopped
    ports:
      - "${CACHE_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ticketz-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: ticketz-garage
    restart: unless-stopped
    ports:
      - "${S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  garage-init:
    image: python:3.12-slim
    container_name: ticketz-garage-init
    volumes:
      - ./docker/garage/init.py:/init.py:ro
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ticketz-garage-admin-token
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK0102030405060708090a0b0c}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20}
      S3_BUCKET: ${S3_BUCKET:-ticketz-files-local}
    command: ["python", "/init.py"]
    depends_on:
      - garage

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: ticketz-dynamodb
    restart: unless-stopped
    command: "-jar DynamoDBLocal.jar -sharedDb"
    ports:
      - "${DYNAMODB_PORT:-8001}:8000"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketz-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-app_password_local}
      CACHE_HOST: valkey
      CACHE_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-ticketz.tickets}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-ticketz.ticket.processing}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-ticketz.ticket.processing.dlq}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      WORKER_DELAY_SECONDS: ${WORKER_DELAY_SECONDS:-0}
      S3_ENDPOINT_URL: http://garage:3900
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:3900}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK0102030405060708090a0b0c}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ticketz-files-local}
      S3_BUCKET_BANNERS: ${S3_BUCKET_BANNERS:-ticketz-files-local}
      S3_BUCKET_TICKETS: ${S3_BUCKET_TICKETS:-ticketz-files-local}
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-ticketz-action-logs}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      SECRET_KEY: ${SECRET_KEY:-ticketz-super-secret-key-change-in-production-min-32-chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALLOW_ORGANIZER_SIGNUP: ${ALLOW_ORGANIZER_SIGNUP:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      dynamodb:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketz-worker
    restart: unless-stopped
    command: ["python", "-m", "worker"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-app_password_local}
      CACHE_HOST: valkey
      CACHE_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-ticketz.tickets}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-ticketz.ticket.processing}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-ticketz.ticket.processing.dlq}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      WORKER_DELAY_SECONDS: ${WORKER_DELAY_SECONDS:-0}
      S3_ENDPOINT_URL: http://garage:3900
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:3900}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK0102030405060708090a0b0c}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ticketz-files-local}
      S3_BUCKET_BANNERS: ${S3_BUCKET_BANNERS:-ticketz-files-local}
      S3_BUCKET_TICKETS: ${S3_BUCKET_TICKETS:-ticketz-files-local}
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-ticketz-action-logs}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
      dynamodb:
        condition: service_started

volumes:
  postgres_data:
  valkey_data:
  rabbitmq_data:
  garage_meta:
  garage_data:
