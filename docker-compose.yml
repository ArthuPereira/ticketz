name: cloud-app

services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_HOST: ${MINISTACK_HOST:-localhost}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${CACHE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # chama com: docker compose run --rm terraform init
  terraform:
    image: hashicorp/terraform:1.10
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./src/infra/local:/workspace
    environment:
      TF_VAR_aws_endpoint: http://ministack:4566
      TF_VAR_aws_region: ${AWS_REGION:-us-east-1}
      TF_VAR_db_name: ${DB_NAME:-appdb}
      TF_VAR_db_username: ${DB_USER:-appuser}
      TF_VAR_db_password: ${DB_PASSWORD:-app_password_local}
    depends_on:
      ministack:
        condition: service_healthy
  
  aws:
    image: amazon/aws-cli:latest
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://ministack:4566
    depends_on:
      ministack:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
